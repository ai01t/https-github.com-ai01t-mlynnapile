<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historie | Mlýn na Pile</title>
    <style>
      :root{--bg:#07060a;--cream:#f0ebe2;--stone:#c9b99a;--gold:#b08d57;--line:rgba(201,185,154,.22)}
      *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--cream);font-family:Manrope,system-ui,sans-serif}
      body{display:grid;place-items:center;padding:40px}
      main{width:min(1180px,100%)}h1{margin:0 0 28px;font:500 70px/.95 "Cormorant Garamond",Georgia,serif}h1 em{color:var(--stone);font-style:italic}
      .timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.item{min-height:230px;padding:22px;border:1px solid var(--line);background:rgba(12,10,12,.6);color:inherit;text-decoration:none}
      .year{display:block;color:var(--gold);font:500 54px/.9 "Cormorant Garamond",Georgia,serif}.item p{margin:18px 0 0;color:rgba(240,235,226,.74);line-height:1.55}
      @media(max-width:800px){body{padding:22px}.timeline{grid-template-columns:1fr}h1{font-size:44px}.item{min-height:0}}
    </style>
  </head>
  <body>
    <main id="timeline">
      <h1>Historie <em>mlýna</em></h1>
      <div class="timeline">
        <a class="item" href="?year=1653#timeline"><span class="year">1653</span><p>Založení rybníků, vysoké pece a hamru.</p></a>
        <a class="item" href="?year=1810#timeline"><span class="year">1810</span><p>Mlýn s pilou poháněnou vodní silou.</p></a>
        <a class="item" href="?year=1990#timeline"><span class="year">1990</span><p>Pila vzniká jako část obce Trhanov v okrese Domažlice.</p></a>
        <a class="item" href="?year=2026#timeline"><span class="year">2026</span><p>Transformace na hudební a kreativní retreat studio.</p></a>
      </div>
    </main>
  </body>
</html>
