html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.6;mix-blend-mode:multiply;

html[data-mode="night"] body::after{opacity:.35;mix-blend-mode:screen;}

.rv{opacity:0;transform:translateY(10px);transition:opacity 1.6s ease,transform 1.6s cubic-bezier(.22,1,.36,1);}
.rv.in{opacity:1;transform:none;}
body.static .rv{opacity:1;transform:none;transition:none;}


@media (max-width:820px){

/* ===================== kresba: mlýn od rybníka (stejné pero jako tištěná karta) =====================

   a kresby se střídají (čáry se „vaří" jako ručně překreslená políčka), k tomu plynulý pohyb –
   hladina plyne, stromy se houpou ve větru, kachna pluje s brázdou, ptáci letí, mrak se sune,
   z komína stoupá kouř a celý obraz se zlehka nadechuje. Statická verze = první kresba bez pohybu. */
const NS='http://www.w3.org/2000/svg';

const ART=document.getElementById('art');
const RC=rough.svg(ART);
const BASE={stroke:INK,strokeWidth:2.7,roughness:1.6,bowing:1.8};
const THIN={strokeWidth:1.7,roughness:1.5},HAIR={strokeWidth:1.2,roughness:1.8,opacity:.6};
const HATCH=(gap,ang,op)=>({stroke:'none',fill:INK,fillStyle:'hachure',hachureGap:gap,fillWeight:1.05,hachureAngle:ang,roughness:1.4,opacity:op});
function pen(group,seed){
  let s=seed;
  const o=(x)=>Object.assign({seed:++s},BASE,x||{});
  const add=(n,x)=>{if(x&&x.opacity!=null)n.setAttribute('opacity',x.opacity);group.appendChild(n);return n;};
  return {
    line:(a,b,c,d,x)=>add(RC.line(a,b,c,d,o(x)),x),
    rect:(a,b,w,h,x)=>add(RC.rectangle(a,b,w,h,o(x)),x),
    poly:(p,x)=>add(RC.polygon(p,o(x)),x),
    lines:(p,x)=>add(RC.linearPath(p,o(x)),x),
    curve:(p,x)=>add(RC.curve(p,o(x)),x),
    path:(d,x)=>add(RC.path(d,o(x)),x),
    ell:(cx,cy,w,h,x)=>add(RC.ellipse(cx,cy,w,h,o(x)),x),
  };
}

function crown(P,r,cx,cy,rx,ry,n,a0,a1,x){
  let d='';
  for(let i=0;i<=n;i++){
    const a=(a0+(a1-a0)*i/n)*Math.PI/180,j=.88+r()*.2;
    const px=cx+Math.cos(a)*rx*j,py=cy+Math.sin(a)*ry*j;
    if(!i){d=`M${px.toFixed(1)} ${py.toFixed(1)}`;continue;}
    const am=(a0+(a1-a0)*(i-.5)/n)*Math.PI/180;
    d+=` Q${(cx+Math.cos(am)*rx*1.28).toFixed(1)} ${(cy+Math.sin(am)*ry*1.28).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`;
  }
  return P.path(d,x);
}
// vrstva = několik variant téže kresby (střídají se → živá, „vařící se" čára)
const LAYERS=[];
function layer(parent,name,frames,build,opts){
  const root=el('g',{id:name},parent);
  const list=[];
  for(let f=0;f<frames;f++){
    const g=el('g',{},root);
    build(pen(g,1000*(f+1)+name.length*37),mulberry32(1653+name.length*101),f);
    if(f)g.style.display='none';
    list.push(g);
  }
  const L=Object.assign({root,frames:list,cur:0,rate:opts&&opts.rate||1},opts||{});
  LAYERS.push(L);return L;
}

let SCN=null,raf=0,animated=false,t0=0,lastBoil=0;
function applyStill(){
  LAYERS.forEach((L)=>{L.frames.forEach((g,i)=>g.style.display=i?'none':'');L.cur=0;
    if(L.sway)L.root.removeAttribute('transform');
    if(L.still)L.root.parentNode.setAttribute('transform',L.still),L.root.parentNode.setAttribute('opacity',1);
    else if(L.move)L.root.removeAttribute('transform');});
  SCN.smoke.still();SCN.petals.setAttribute('opacity',0);SCN.cam.removeAttribute('transform');
}
function frame(now){
  const t=(now-t0)/1000;
  // „vaření" čar: 8 kreseb za sekundu (jako ručně kreslený film), voda a ptáci svým tempem
  if(now-lastBoil>125){
    lastBoil=now;
    LAYERS.forEach((L)=>{L.acc=(L.acc||0)+L.rate;if(L.acc<1)return;L.acc-=1;
      L.frames[L.cur].style.display='none';L.cur=(L.cur+1)%L.frames.length;L.frames[L.cur].style.display='';});
  }
  LAYERS.forEach((L)=>{
    if(L.sway){const s=L.sway,a=s.amp*Math.sin(t*s.f+s.ph)+s.amp*.35*Math.sin(t*s.f*2.3+s.ph);L.root.setAttribute('transform',`rotate(${a.toFixed(3)} ${s.x} ${s.y})`);}
    if(L.move){const tr=L.move(t);if(L.still)L.root.parentNode.setAttribute('transform',tr);else L.root.setAttribute('transform',tr);}
  });
  SCN.smoke.tick(t);SCN.petals.setAttribute('opacity',1);SCN.petals.tick(t);
  // obraz se zlehka nadechuje (velmi pomalý nájezd kamery)
  const z=1+.018*Math.sin(t*.07);SCN.cam.setAttribute('transform',`translate(1000 700) scale(${z.toFixed(4)}) translate(-1000 -700)`);
  raf=requestAnimationFrame(frame);
}
function setAnimated(on){
  animated=on&&!reduce;
  const T=L10N[D.l]||L10N.cs;$('btnMotion').textContent=animated?T.pause:T.play;
  cancelAnimationFrame(raf);raf=0;
  if(animated){t0=performance.now();lastBoil=0;raf=requestAnimationFrame(frame);}
  else applyStill();
}
$('btnMotion').addEventListener('click',()=>setAnimated(!animated));
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;}else if(animated&&!raf)raf=requestAnimationFrame(frame);});
