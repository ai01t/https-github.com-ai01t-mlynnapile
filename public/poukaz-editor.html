<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dárkový poukaz – Mlýn na Pile</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Dárkový poukaz Mlýn na Pile.
   Zákazník (odkaz z webu, ?v=varianta&lang=…): vybere variantu a styl, napíše jméno a věnování,
   vidí živý náhled (se značkou VZOR) a odešle objednávku e-mailem.
   Majitel (?admin): navíc kód, platnost, cena, tisk A5 a stažení PDF bez značky. */
:root{
  --bg:#0b0a0d; --panel:#121015; --line:rgba(201,185,154,.18); --text:#f0ebe2; --muted:rgba(240,235,226,.6);
  --gold:#b08d57; --gold-light:#d7b47d;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;font-weight:300;}
a{color:inherit;}

.top{display:flex;align-items:center;gap:16px;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Cormorant Garamond',serif;font-size:1.35rem;}
.top .brand svg{width:26px;color:var(--gold);}
.top .brand em{font-style:normal;color:var(--gold);}
.top .back{margin-left:auto;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;}
.top .back:hover{color:var(--gold-light);}
.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--text);font-size:1.3rem;line-height:1;cursor:pointer;transition:border-color .2s,color .2s;}
.close:hover{border-color:var(--gold);color:var(--gold-light);}
.langs{display:flex;gap:4px;}
.langs button{padding:6px 9px;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;}
.langs button.on{border-color:var(--line);color:var(--gold-light);}

.wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:clamp(24px,4vw,56px);max-width:1380px;margin:0 auto;padding:clamp(20px,4vw,48px);}
.intro .kicker{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
.intro h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(2rem,3.4vw,2.8rem);line-height:1.05;margin:8px 0 10px;}
.intro h1 em{color:var(--gold-light);}
.intro p{margin:0 0 6px;font-size:.82rem;line-height:1.6;color:var(--muted);}

.step{margin-top:26px;}
.step-t{display:flex;align-items:center;gap:10px;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.step-t i{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--gold);border-radius:50%;font-style:normal;font-size:.6rem;letter-spacing:0;}
.variants{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.variant{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s;}
.variant:hover{border-color:rgba(176,141,87,.5);}
.variant.on{border-color:var(--gold);background:rgba(176,141,87,.1);}
.variant b{font-weight:400;font-size:.8rem;}
.variant small{font-size:.62rem;color:var(--muted);}
.variant strong{margin-top:4px;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.2rem;color:var(--gold);}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.styles button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:.66rem;cursor:pointer;}
.styles button span{width:100%;aspect-ratio:210/148;border:1px solid rgba(0,0,0,.2);}
.styles button[data-s="night"] span{background:#0b0a0d;box-shadow:inset 0 0 0 3px #0b0a0d,inset 0 0 0 4px #c8a96e;}
.styles button[data-s="paper"] span{background:#f1e7d3;box-shadow:inset 0 0 0 3px #f1e7d3,inset 0 0 0 4px #9a7238;}
.styles button[data-s="minimal"] span{background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px #111;}
.styles button.on{border-color:var(--gold);color:var(--gold-light);}
label{display:block;font-size:.66rem;color:var(--muted);margin:12px 0 5px;}
input,textarea,select{width:100%;padding:10px 12px;background:#0b0a0d;border:1px solid var(--line);color:var(--text);font:inherit;font-size:.86rem;}
textarea{min-height:70px;resize:vertical;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);}
.count{float:right;font-size:.6rem;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.delivery{display:flex;gap:8px;}
.delivery button{flex:1;padding:10px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:.72rem;cursor:pointer;}
.delivery button.on{border-color:var(--gold);color:var(--gold-light);background:rgba(176,141,87,.1);}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.76rem;color:var(--muted);}
.check input{width:auto;}
.admin{display:none;margin-top:26px;padding:16px;border:1px dashed rgba(176,141,87,.4);}
body.is-admin .admin{display:block;}
.actions{display:grid;gap:8px;margin-top:22px;}
.btn{padding:14px;border:1px solid var(--gold);background:var(--gold);color:#0b0a0d;font:inherit;font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none;transition:background .2s;}
.btn:hover{background:var(--gold-light);}
.btn.ghost{background:none;color:var(--gold-light);}
.btn.ghost:hover{background:rgba(176,141,87,.1);}
.fine{margin-top:10px;font-size:.66rem;line-height:1.6;color:var(--muted);}

.preview{position:sticky;top:24px;align-self:start;}
.preview-t{display:flex;justify-content:space-between;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

/* ── poukaz: A5 na šířku (210 × 148 mm), velikosti v cqw ať sedí v náhledu i v tisku ── */
.voucher{position:relative;width:100%;aspect-ratio:210 / 148;overflow:hidden;container-type:inline-size;
  --v-ink:#f0ebe2; --v-soft:rgba(240,235,226,.62); --v-accent:#c8a96e; --v-frame:rgba(200,169,110,.5);
  background:radial-gradient(ellipse 80% 70% at 30% 40%,#17141a 0%,#0b0a0d 70%);color:var(--v-ink);box-shadow:0 30px 80px rgba(0,0,0,.55);transition:background .4s,color .4s;}
.voucher.s-paper{--v-ink:#2a2118;--v-soft:rgba(42,33,24,.62);--v-accent:#9a7238;--v-frame:rgba(154,114,56,.55);
  background:radial-gradient(ellipse 90% 80% at 50% 45%,#f8f1e3 0%,#efe4cf 70%,#e6d7bb 100%);}
.voucher.s-minimal{--v-ink:#111;--v-soft:#666;--v-accent:#111;--v-frame:#111;background:#fff;}
.v-frame{position:absolute;inset:3.2cqw;border:.18cqw solid var(--v-frame);}
.v-frame::after{content:"";position:absolute;inset:.8cqw;border:.09cqw solid var(--v-frame);opacity:.6;}
.s-minimal .v-frame::after{display:none;}
.v-wheel{position:absolute;right:-9cqw;bottom:-11cqw;width:46cqw;color:var(--v-accent);opacity:.08;}
.v-body{position:absolute;inset:7cqw 8cqw;display:flex;flex-direction:column;}
.v-top{display:flex;align-items:center;gap:1.6cqw;}
.v-logo{width:5.2cqw;color:var(--v-accent);}
.v-brand{font-family:'Cormorant Garamond',serif;font-size:2.3cqw;letter-spacing:.04em;}
.v-brand em{color:var(--v-accent);font-style:normal;}
.v-kicker{margin-left:auto;font-size:1.15cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--v-accent);}
.v-main{margin-top:auto;margin-bottom:auto;}
.v-for{font-size:1.25cqw;letter-spacing:.28em;text-transform:uppercase;color:var(--v-soft);margin-bottom:1cqw;}
.v-name{font-family:'Cormorant Garamond',serif;font-size:6.4cqw;line-height:1.02;font-weight:400;margin:0;overflow-wrap:anywhere;}
.v-name.long{font-size:4.8cqw;}
.v-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:3cqw;color:var(--v-accent);margin:1.4cqw 0 0;}
.v-desc{font-size:1.45cqw;color:var(--v-soft);margin:.8cqw 0 0;}
.v-msg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2cqw;line-height:1.35;margin:2.2cqw 0 0;max-width:62%;white-space:pre-line;}
.v-msg:empty{display:none;}
.v-msg.long{font-size:1.85cqw;max-width:76%;}
.v-msg.xlong{font-size:1.65cqw;line-height:1.3;max-width:84%;}
.v-foot{display:flex;align-items:flex-end;gap:4cqw;font-size:1.1cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--v-soft);}
.v-foot b{display:block;margin-top:.4cqw;font-weight:600;letter-spacing:.08em;color:var(--v-ink);font-size:1.3cqw;}
.v-price{margin-left:auto;text-align:right;}
.v-price b{text-transform:none;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:2.6cqw;letter-spacing:0;color:var(--v-accent);}
/* značka VZOR v náhledu pro zákazníka */
.v-sample{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);font-family:'Cormorant Garamond',serif;font-size:13cqw;letter-spacing:.2em;color:var(--v-accent);opacity:.08;pointer-events:none;white-space:nowrap;}
body.is-admin .v-sample{display:none;}
.sent{display:none;margin-top:14px;padding:12px 14px;border:1px solid rgba(176,141,87,.4);font-size:.76rem;line-height:1.55;color:var(--muted);}
.sent.on{display:block;}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;}
  .preview{position:static;order:-1;}
}
@page{size:A5 landscape;margin:0;}
@media print{
  html,body{background:#fff;}
  .top,.form,.preview-t{display:none !important;}
  .wrap{display:block;padding:0;max-width:none;}
  .voucher{box-shadow:none;width:210mm;height:148mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" id="homeLink"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#wheel"/></svg><span id="brandTxt">Mlýn <em>na Pile</em></span></a>
  <a class="back" href="/#studio" id="backLink" data-t="back"></a>
  <div class="langs" id="langs">
    <button type="button" data-l="cs">CZ</button><button type="button" data-l="en">EN</button><button type="button" data-l="de">DE</button>
  </div>
  <button type="button" class="close" id="btnClose" aria-label="Zavřít">×</button>
</header>

<div class="wrap">
  <section class="form">
    <div class="intro">
      <span class="kicker" data-t="kicker"></span>
      <h1 data-t="title"></h1>
      <p data-t="lead"></p>
    </div>

    <div class="step">
      <div class="step-t"><i>1</i><span data-t="s1"></span></div>
      <div class="variants" id="variants"></div>
    </div>

    <div class="step">
      <div class="step-t"><i>2</i><span data-t="s2"></span></div>
      <label for="fName" data-t="name"></label>
      <input id="fName" maxlength="40" autocomplete="off">
      <label for="fMsg"><span data-t="msg"></span><span class="count" id="msgCount"></span></label>
      <textarea id="fMsg" maxlength="420" style="min-height:120px"></textarea>
      <label for="fFrom" data-t="from"></label>
      <input id="fFrom" maxlength="40" autocomplete="off">
    </div>

    <div class="step">
      <div class="step-t"><i>3</i><span data-t="s3"></span></div>
      <div class="styles" id="styles">
        <button type="button" data-s="night" class="on"><span></span><em data-t="stNight"></em></button>
        <button type="button" data-s="paper"><span></span><em data-t="stPaper"></em></button>
        <button type="button" data-s="minimal"><span></span><em data-t="stMin"></em></button>
      </div>
    </div>

    <div class="step">
      <div class="step-t"><i>4</i><span data-t="s4"></span></div>
      <div class="delivery" id="delivery">
        <button type="button" data-d="email" class="on" data-t="dEmail"></button>
        <button type="button" data-d="post" data-t="dPost"></button>
      </div>
      <div id="postWrap" hidden>
        <label for="fAddr" data-t="addr"></label>
        <textarea id="fAddr" style="min-height:58px"></textarea>
      </div>
      <label for="fBuyer" data-t="buyer"></label>
      <input id="fBuyer" autocomplete="name">
    </div>

    <div class="actions">
      <a class="btn" id="btnOrder" href="#" data-t="order"></a>
      <button type="button" class="btn ghost" id="btnCopy" data-t="copy"></button>
    </div>
    <p class="fine" data-t="fine"></p>
    <p class="sent" id="sent" data-t="sent"></p>

    <!-- jen pro majitele: ?admin -->
    <div class="admin">
      <div class="step-t" style="margin-bottom:4px"><span>Vydání poukazu (admin)</span></div>
      <div class="row">
        <div><label for="fCode">Kód</label><input id="fCode" autocomplete="off"></div>
        <div><label for="fValid">Platí do</label><input id="fValid" type="date"></div>
      </div>
      <label class="check"><input type="checkbox" id="fPrice"> Zobrazit cenu na poukazu</label>
      <div class="actions">
        <button type="button" class="btn" id="btnPdf">Stáhnout PDF</button>
        <button type="button" class="btn ghost" id="btnPrint">Tisk (A5 na šířku)</button>
        <button type="button" class="btn ghost" id="btnCode">Nový kód</button>
      </div>
    </div>
  </section>

  <aside class="preview">
    <div class="preview-t"><span data-t="prev"></span><span>A5</span></div>
    <div class="voucher" id="voucher">
      <svg class="v-wheel" viewBox="0 0 100 100" aria-hidden="true"><use href="#wheel"/></svg>
      <div class="v-frame"></div>
      <div class="v-sample" id="vSample"></div>
      <div class="v-body">
        <div class="v-top">
          <svg class="v-logo" viewBox="0 0 100 100" aria-hidden="true"><use href="#wheel"/></svg>
          <span class="v-brand" id="vBrand"></span>
          <span class="v-kicker" id="vKicker"></span>
        </div>
        <div class="v-main">
          <div class="v-for" id="vFor"></div>
          <h2 class="v-name" id="vName"></h2>
          <p class="v-title" id="vTitle"></p>
          <p class="v-desc" id="vDesc"></p>
          <p class="v-msg" id="vMsg"></p>
        </div>
        <div class="v-foot">
          <div><span id="lCode"></span><b id="vCode"></b></div>
          <div><span id="lValid"></span><b id="vValid"></b></div>
          <div id="vFromWrap"><span id="lFrom"></span><b id="vFrom"></b></div>
          <div class="v-price" id="vPriceWrap"><span id="lPrice"></span><b id="vPrice"></b></div>
        </div>
      </div>
    </div>
  </aside>
</div>

  <defs>
    <g id="wheel" stroke="currentColor" fill="none">
      <line x1="76.79" y1="61.10" x2="87.88" y2="65.69" stroke-width="8"/><line x1="61.10" y1="76.79" x2="65.69" y2="87.88" stroke-width="8"/><line x1="38.90" y1="76.79" x2="34.31" y2="87.88" stroke-width="8"/><line x1="23.21" y1="61.10" x2="12.12" y2="65.69" stroke-width="8"/><line x1="23.21" y1="38.90" x2="12.12" y2="34.31" stroke-width="8"/><line x1="38.90" y1="23.21" x2="34.31" y2="12.12" stroke-width="8"/><line x1="61.10" y1="23.21" x2="65.69" y2="12.12" stroke-width="8"/><line x1="76.79" y1="38.90" x2="87.88" y2="34.31" stroke-width="8"/>

      <circle cx="50" cy="50" r="8.5" fill="currentColor" stroke="none"/>

</svg>

const $=(id)=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const isAdmin=params.has('admin');
document.body.classList.toggle('is-admin',isAdmin);
const state={
  lang:['cs','en','de'].includes(params.get('lang'))?params.get('lang'):'cs',
  variant:VARIANTS.includes(params.get('v'))?params.get('v'):'guitar',
  style:'night',delivery:'email',
};

function newCode(){
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='';for(let i=0;i<4;i++)c+=abc[Math.floor(Math.random()*abc.length)];
  $('fCode').value=`MNP-${new Date().getFullYear()}-${c}`;
}
function fmtDate(iso){
  if(!iso)return'';
  const [y,m,d]=iso.split('-').map(Number);
  return new Intl.DateTimeFormat({cs:'cs-CZ',en:'en-GB',de:'de-DE'}[state.lang],{day:'numeric',month:'numeric',year:'numeric'}).format(new Date(y,m-1,d));
}
function order(){
  const t=T[state.lang];
  const styleName={night:t.stNight,paper:t.stPaper,minimal:t.stMin}[state.style];
  const o={v:t.v[state.variant],name:$('fName').value.trim()||'—',msg:$('fMsg').value.trim(),from:$('fFrom').value.trim(),
    style:styleName,del:state.delivery==='post'?t.delPost($('fAddr').value.trim().replace(/\n+/g,', ')):t.delEmail,buyer:$('fBuyer').value.trim()};
  return {subject:t.subj(o),body:t.mail(o)};
}

function renderTexts(){
  const t=T[state.lang];
  document.documentElement.lang=state.lang;
  document.querySelectorAll('[data-t]').forEach((el)=>{const v=t[el.dataset.t];if(typeof v==='string')el.innerHTML=v;});
  $('brandTxt').innerHTML=t.brand; $('homeLink').href=t.home; $('backLink').href=`${t.home}#studio`;
  $('fName').placeholder=t.namePh; $('fMsg').placeholder=t.msgPh;
  // ukázkové věnování podle varianty (vysvětlí, co se s poukazem dá dělat), dokud ho zákazník nepřepíše
  if(!msgTouched)$('fMsg').value=t.ex[state.variant];
  document.querySelectorAll('#langs button').forEach((b)=>b.classList.toggle('on',b.dataset.l===state.lang));
  $('variants').innerHTML=VARIANTS.map((k)=>{const v=t.v[k];return `<button type="button" class="variant${k===state.variant?' on':''}" data-v="${k}"><b>${v[0]}</b><small>${v[1]}</small><strong>${v[2]}</strong></button>`;}).join('');
  document.title=`${t.kicker} – ${t.brand.replace(/<[^>]+>/g,'')}`;
}
function renderVoucher(){
  const t=T[state.lang], v=t.v[state.variant];
  $('vBrand').innerHTML=t.brand; $('vKicker').textContent=t.vk; $('vFor').textContent=t.vfor; $('vSample').textContent=t.sample;
  $('lCode').textContent=t.code; $('lValid').textContent=t.valid; $('lFrom').textContent=t.vfrom; $('lPrice').textContent=t.price;
  const name=$('fName').value.trim()||t.namePh;
  $('vName').textContent=name; $('vName').classList.toggle('long',name.length>22);
  $('vTitle').textContent=v[3]; $('vDesc').textContent=v[4]; $('vPrice').textContent=v[2];
  const msg=$('fMsg').value.trim();
  $('vMsg').textContent=msg; $('vMsg').classList.toggle('long',msg.length>140&&msg.length<=280); $('vMsg').classList.toggle('xlong',msg.length>280);
  $('vCode').textContent=isAdmin?$('fCode').value:'— '+t.codeLater;
  $('vValid').textContent=isAdmin?fmtDate($('fValid').value):fmtDate($('fValid').value);
  $('vFrom').textContent=$('fFrom').value.trim();
  $('vFromWrap').style.display=$('fFrom').value.trim()?'':'none';
  $('vPriceWrap').style.visibility=isAdmin&&$('fPrice').checked?'visible':'hidden';
  $('msgCount').textContent=`${$('fMsg').value.length}/420`;
  const o=order();
  $('btnOrder').href=`mailto:${EMAIL}?subject=${encodeURIComponent(o.subject)}&body=${encodeURIComponent(o.body)}`;
}
function render(){renderTexts();renderVoucher();}

// výchozí hodnoty
newCode();
const until=new Date();until.setFullYear(until.getFullYear()+1);
$('fValid').value=`${until.getFullYear()}-${String(until.getMonth()+1).padStart(2,'0')}-${String(until.getDate()).padStart(2,'0')}`;

let msgTouched=false;
$('fMsg').addEventListener('input',()=>{msgTouched=true;});
document.addEventListener('input',renderVoucher);
$('variants').addEventListener('click',(e)=>{const b=e.target.closest('[data-v]');if(!b)return;state.variant=b.dataset.v;render();});
$('langs').addEventListener('click',(e)=>{const b=e.target.closest('[data-l]');if(!b)return;state.lang=b.dataset.l;render();});
$('styles').addEventListener('click',(e)=>{
  const b=e.target.closest('[data-s]');if(!b)return;state.style=b.dataset.s;
  document.querySelectorAll('#styles button').forEach((x)=>x.classList.toggle('on',x===b));
  $('voucher').classList.remove('s-paper','s-minimal');
  if(state.style!=='night')$('voucher').classList.add(`s-${state.style}`);
  renderVoucher();
});
$('delivery').addEventListener('click',(e)=>{
  const b=e.target.closest('[data-d]');if(!b)return;state.delivery=b.dataset.d;
  document.querySelectorAll('#delivery button').forEach((x)=>x.classList.toggle('on',x===b));
  $('postWrap').hidden=state.delivery!=='post';
  renderVoucher();
});
$('btnOrder').addEventListener('click',()=>{$('sent').classList.add('on');});
$('btnCopy').addEventListener('click',async()=>{
  const o=order();
  try{await navigator.clipboard.writeText(`${o.subject}\n\n${o.body}`);}catch(e){}
  const b=$('btnCopy');b.textContent=T[state.lang].copied;setTimeout(()=>{b.textContent=T[state.lang].copy;},1800);
});
$('btnCode').addEventListener('click',()=>{newCode();renderVoucher();});
$('btnPrint').addEventListener('click',()=>window.print());
$('btnPdf').addEventListener('click',async()=>{
  const btn=$('btnPdf');btn.disabled=true;btn.textContent='Připravuji…';
  try{
    await document.fonts.ready;
    const canvas=await html2canvas($('voucher'),{scale:3,backgroundColor:null,useCORS:true});
    const pdf=new jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a5'});
    pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,210,148);
    const who=($('fName').value||'poukaz').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
    pdf.save(`poukaz-${who||'mlyn'}-${$('fCode').value}.pdf`);
  }finally{btn.disabled=false;btn.textContent='Stáhnout PDF';}
});
// zavření: zpět na web (na sekci Studio), z webu přes historii prohlížeče
function closeEditor(){
  try{
    if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}
  }catch(e){}
  location.href=`${T[state.lang].home}#studio`;
}
$('btnClose').addEventListener('click',closeEditor);
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))closeEditor();});
render();
</script>
