<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bread Fitt - kváskový plánovač</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ink: #3b281b;
      --muted: #8b765d;
      --paper: #fff7df;
      --paper-soft: rgba(255, 248, 226, .88);
      --cream: #f3e3bd;
      --crust: #995b1d;
      --crust-dark: #673612;
      --honey: #e8b84f;
      --leaf: #5e876d;
      --water: #5b9bc6;
      --line: rgba(128, 89, 36, .22);
      --shadow: 0 24px 70px rgba(97, 61, 21, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.72) 0 11rem, transparent 11.4rem),
        radial-gradient(circle at 78% 4%, rgba(255,220,132,.55) 0 10rem, transparent 10.5rem),
        linear-gradient(180deg, #fbefd0 0%, #f3dfb1 47%, #ead39e 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 24px 32px, rgba(126, 83, 29, .15) 1px, transparent 1.4px),
        radial-gradient(circle at 88px 70px, rgba(255, 255, 255, .42) 1px, transparent 1.5px);
      background-size: 112px 112px;
      mix-blend-mode: multiply;
      opacity: .45;
    }

    .paper {
      background: var(--paper-soft);
      border: 1px solid rgba(128, 89, 36, .16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .warm-chip {
      background: rgba(255, 248, 226, .78);
      border: 1px solid rgba(128, 89, 36, .15);
      box-shadow: 0 10px 22px rgba(97, 61, 21, .07);
    }

    .brand-letter {
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,.28), transparent 25%),
        linear-gradient(145deg, #b96d25, #7b3d16);
    }

    .story-node {
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .story-node:hover {
      transform: translateY(-2px);
    }

    .story-node[aria-pressed="true"] {
      background: #fff4d2;
      border-color: rgba(153, 91, 29, .55);
      box-shadow: 0 16px 34px rgba(153, 91, 29, .16);
    }

    input[type="range"] {
      accent-color: var(--crust);
    }

    button, input { font: inherit; }

    canvas {
      min-height: 290px;
      touch-action: none;
    }

    .grain-line {
      background-image:
        linear-gradient(90deg, rgba(153, 91, 29, .16), rgba(153, 91, 29, .04)),
        repeating-linear-gradient(0deg, transparent 0 11px, rgba(153, 91, 29, .08) 11px 12px);
    }

    .bread-illo {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #fff8d9 0 30%, transparent 31%), linear-gradient(135deg, #fff3ce, #e9f2df);
    }

    .bread-illo::before {
      content: "";
      position: absolute;
      left: 18%;
      top: 34%;
      width: 46%;
      height: 30%;
      border-radius: 55% 55% 45% 45%;
      background: linear-gradient(180deg, #b76a2b, #874219);
      box-shadow: inset 0 10px 18px rgba(255,255,255,.18);
    }

    .bread-illo::after {
      content: "";
      position: absolute;
      left: 28%;
      top: 28%;
      width: 42%;
      height: 26%;
      border-top: 4px solid rgba(255,247,213,.85);
      border-radius: 50%;
      transform: rotate(-7deg);
    }

    body[data-design="poster"] {
      --paper-soft: rgba(255, 241, 205, .9);
      --crust: #b05a17;
      --crust-dark: #6d300c;
      --honey: #f2bd39;
      --leaf: #5d9156;
      --water: #3487bd;
      background:
        radial-gradient(circle at 72% 11%, rgba(255,199,58,.55) 0 13rem, transparent 13.5rem),
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.8) 0 10rem, transparent 10.5rem),
        linear-gradient(160deg, #fff4cf 0%, #eec979 100%);
    }

    body[data-design="night"] {
      --ink: #f8edcb;
      --muted: #d9c9a5;
      --paper-soft: rgba(44, 48, 83, .72);
      --crust: #f0a13c;
      --crust-dark: #ffe0a5;
      --honey: #f4d677;
      --leaf: #8fc5a0;
      --water: #8bc6e8;
      --line: rgba(255, 239, 188, .22);
      --shadow: 0 24px 70px rgba(16, 20, 44, .28);
      background:
        radial-gradient(circle at 70% 8%, rgba(244,214,119,.34) 0 9rem, transparent 9.4rem),
        radial-gradient(circle at 20% 78%, rgba(139,198,232,.18) 0 18rem, transparent 18.5rem),
        linear-gradient(180deg, #28325d 0%, #514879 48%, #8c6a4d 100%);
    }

    body[data-design="clean"] {
      --ink: #2d261e;
      --muted: #756b5d;
      --paper-soft: rgba(255, 253, 246, .92);
      --crust: #81522c;
      --crust-dark: #4f2e17;
      --honey: #d7b15d;
      --leaf: #5c806b;
      --water: #5c91a8;
      background: linear-gradient(180deg, #fbf6e9 0%, #eee4d0 100%);
    }

    body[data-layout="focus"] #storySection {
      display: none;
    }

    body[data-layout="focus"] #mainGrid {
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    body[data-layout="recipe"] #mainGrid {
      grid-template-columns: minmax(0, .92fr) 470px;
    }

    body[data-layout="recipe"] #storySection > div {
      height: 104px;
    }

    .control-button[aria-pressed="true"] {
      background: var(--crust);
      color: #fff;
      border-color: transparent;
    }

    @media (max-height: 820px) {
      canvas { min-height: 250px; }
      .short-hide { display: none; }
      .short-tight { padding-top: .55rem; padding-bottom: .55rem; }
    }

    @media (max-width: 900px) {
      canvas { min-height: 230px; }
    }
  </style>
</head>
<body class="h-screen overflow-hidden">
  <main id="app" class="relative h-screen overflow-hidden p-3 lg:p-4">
    <section class="h-full grid grid-rows-[auto_auto_minmax(0,1fr)_auto] gap-3">
      <header class="paper rounded-lg px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div class="brand-letter h-11 w-11 rounded-lg text-white grid place-items-center shadow-lg shadow-orange-900/20">
            <span class="text-xl font-semibold">BF</span>
          </div>
          <div class="min-w-0">
            <div class="flex items-baseline gap-2 min-w-0">
              <h1 class="text-xl lg:text-2xl font-semibold tracking-tight whitespace-nowrap">Bread Fitt</h1>
              <span id="brandJoke" class="hidden sm:inline text-xs font-semibold uppercase tracking-[.18em] text-[var(--muted)] truncate"></span>
            </div>
            <p id="subtitle" class="text-sm text-[var(--muted)] truncate"></p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <div class="hidden xl:flex items-center gap-2">
            <div class="warm-chip rounded-full p-1 flex items-center gap-1">
              <button id="layoutStory" type="button" class="control-button rounded-full border border-transparent px-3 py-1.5 text-xs font-semibold"></button>
              <button id="layoutFocus" type="button" class="control-button rounded-full border border-transparent px-3 py-1.5 text-xs font-semibold"></button>
              <button id="layoutRecipe" type="button" class="control-button rounded-full border border-transparent px-3 py-1.5 text-xs font-semibold"></button>
            </div>
            <div class="warm-chip rounded-full p-1 flex items-center gap-1">
              <button id="designPoster" type="button" class="control-button rounded-full border border-transparent px-3 py-1.5 text-xs font-semibold"></button>
              <button id="designNight" type="button" class="control-button rounded-full border border-transparent px-3 py-1.5 text-xs font-semibold"></button>
              <button id="designClean" type="button" class="control-button rounded-full border border-transparent px-3 py-1.5 text-xs font-semibold"></button>
            </div>
            <label class="warm-chip rounded-full px-3 py-1.5 flex items-center gap-2 text-xs font-semibold">
              <span id="detailLabel"></span>
              <input id="detailRange" class="w-24" type="range" min="1" max="3" step="1">
            </label>
          </div>
          <div class="hidden md:flex items-center gap-2">
            <div class="warm-chip rounded-full px-4 py-2">
              <span id="deliveryLabel" class="text-[10px] uppercase tracking-[.16em] text-[var(--muted)] mr-2"></span>
              <strong id="deliveryValue" class="tabular-nums"></strong>
            </div>
            <div class="warm-chip rounded-full px-3 py-2">
              <span id="totalLabel" class="text-[10px] uppercase tracking-[.16em] text-[var(--muted)] mr-2"></span>
              <strong id="totalTime" class="tabular-nums"></strong>
            </div>
          </div>
          <div class="flex rounded-full border border-amber-900/15 bg-[#fff8e6]/75 p-1" aria-label="Language">
            <button id="langCs" class="px-3 py-2 rounded-full text-sm font-semibold" type="button">CZ</button>
            <button id="langEn" class="px-3 py-2 rounded-full text-sm font-semibold" type="button">EN</button>
          </div>
        </div>
      </header>

      <section id="storySection" class="paper rounded-lg overflow-hidden">
        <div class="relative h-[122px] lg:h-[138px]">
          <div class="absolute inset-0 bg-gradient-to-r from-sky-100 via-indigo-900 to-amber-100 opacity-75"></div>
          <div class="absolute inset-x-0 bottom-8 h-px bg-white/70 shadow-[0_0_18px_rgba(255,255,255,.7)]"></div>
          <div class="absolute left-[7%] bottom-8 h-16 w-16 rounded-full bg-yellow-300 shadow-[0_0_42px_rgba(250,204,21,.75)]"></div>
          <div class="absolute right-[9%] bottom-8 h-20 w-20 rounded-full bg-yellow-200 shadow-[0_0_50px_rgba(250,204,21,.65)]"></div>
          <div class="absolute left-[56%] top-8 h-10 w-10 rounded-full bg-white/80 shadow-lg"></div>
          <div class="absolute left-[58%] top-5 h-10 w-10 rounded-full bg-indigo-900/75"></div>
          <div id="stars" class="absolute inset-0"></div>
          <div id="storyline" class="relative z-10 h-full px-4 lg:px-7 flex items-end gap-2 pb-3"></div>
        </div>
      </section>

      <section id="mainGrid" class="min-h-0 grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_390px] gap-3">
        <div class="min-h-0 paper rounded-lg p-3 lg:p-4 grid grid-rows-[auto_minmax(0,1fr)_auto] gap-3">
          <div class="flex items-center justify-between gap-3">
            <div class="min-w-0">
              <h2 id="gridTitle" class="text-lg lg:text-xl font-semibold tracking-tight"></h2>
              <p id="gridHint" class="text-sm text-[var(--muted)] truncate"></p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button id="todayBtn" type="button" class="warm-chip rounded-full px-4 py-2 text-sm font-semibold hover:bg-white"></button>
              <button id="plusDayBtn" type="button" class="rounded-full bg-[var(--crust)] px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-orange-900/20 hover:bg-[var(--crust-dark)]">+24h</button>
            </div>
          </div>

          <div class="relative min-h-0 rounded-lg border border-amber-900/15 bg-[#fff2ca]/70 overflow-hidden">
            <canvas id="handoverCanvas" class="h-full w-full block" aria-label="Bread Fitt handover calendar"></canvas>
          </div>

          <div class="grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 text-xs text-[var(--muted)]">
            <span id="minDateLabel" class="tabular-nums"></span>
            <div class="h-3 rounded-full bg-gradient-to-r from-[var(--leaf)] via-[var(--honey)] to-[var(--crust)] shadow-inner"></div>
            <span id="maxDateLabel" class="tabular-nums"></span>
          </div>
        </div>

        <aside class="min-h-0 paper rounded-lg p-3 lg:p-4 grid grid-rows-[auto_auto_minmax(0,1fr)] gap-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h2 id="recipeTitle" class="text-lg font-semibold tracking-tight"></h2>
              <p id="recipeSub" class="text-sm text-[var(--muted)]"></p>
            </div>
            <div class="bread-illo h-16 w-24 rounded-lg border border-amber-900/15 shrink-0"></div>
          </div>

          <div class="rounded-lg bg-[#fff8e6]/75 border border-amber-900/15 p-3">
            <div class="flex items-center justify-between gap-3">
              <label id="weightLabel" for="weightRange" class="text-sm font-semibold"></label>
              <output id="weightOut" for="weightRange" class="text-xl font-semibold tabular-nums text-[var(--crust-dark)]"></output>
            </div>
            <input id="weightRange" class="mt-3 w-full" type="range" min="600" max="2400" step="50">
            <div class="mt-2 flex justify-between text-[11px] text-[var(--muted)] tabular-nums">
              <span>600 g</span>
              <span>2400 g</span>
            </div>
          </div>

          <div class="min-h-0 grid content-start gap-2">
            <div class="grid grid-cols-3 gap-2">
              <div class="rounded-lg bg-amber-50/80 border border-amber-900/10 p-2">
                <p id="flourLabel" class="text-[10px] uppercase tracking-[.14em] text-[var(--muted)]"></p>
                <p id="flourOut" class="text-lg font-semibold tabular-nums"></p>
              </div>
              <div class="rounded-lg bg-sky-50/80 border border-sky-900/10 p-2">
                <p id="waterLabel" class="text-[10px] uppercase tracking-[.14em] text-[var(--muted)]"></p>
                <p id="waterOut" class="text-lg font-semibold tabular-nums text-[var(--water)]"></p>
              </div>
              <div class="rounded-lg bg-orange-50/80 border border-orange-900/10 p-2">
                <p id="hydrationLabel" class="text-[10px] uppercase tracking-[.14em] text-[var(--muted)]"></p>
                <p class="text-lg font-semibold tabular-nums">78%</p>
              </div>
            </div>
            <div id="ingredients" class="grid grid-cols-2 gap-2"></div>
          </div>
        </aside>
      </section>

      <footer class="paper rounded-lg p-2">
        <div id="timeline" class="grid grid-cols-11 gap-1.5"></div>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "breadfitt.v2";
      const MS = 60000;
      const DAY = 24 * 60 * MS;
      const START_HOUR = 6;
      const END_HOUR = 22;
      const TOTAL_GRID_MIN = (END_HOUR - START_HOUR) * 60;

      const i18n = {
        cs: {
          brandJoke: "fit plán pro chleba",
          subtitle: "Obrázkový plán kváskového chleba pro rušný den",
          total: "postup",
          delivery: "předání",
          recipe: "Recept 1",
          recipeSub: "Těsto se samo přepočítá podle velikosti bochníku.",
          hydration: "hydratace",
          weight: "Velikost bochníku",
          flour: "mouky",
          water: "voda",
          gridTitle: "Naplánovat podle předání",
          gridHint: "Táhni kulatý bochník. V tabulce vidíš i všechny předchozí body spojené do trasy.",
          today: "Nejdřív",
          detail: "detaily",
          layouts: ["příběh", "velká mapa", "recept"],
          designs: ["med", "noc", "čistě"],
          min: "nejdřív",
          max: "výhled",
          days: ["ne", "po", "út", "st", "čt", "pá", "so"],
          dayNames: ["neděle", "pondělí", "úterý", "středa", "čtvrtek", "pátek", "sobota"],
          ingredients: {
            wheat: "Pšeničná",
            rye: "Žitná",
            pernerka: "Pernerka",
            water: "Voda",
            salt: "Sůl",
            cumin: "Kmín"
          },
          steps: [
            "Nakrm kvásek",
            "Autolýza",
            "Fermentolýza",
            "Sůl + voda",
            "Překlady",
            "Odpočinek",
            "Lednice",
            "Rozehřát pec",
            "Pečení",
            "Chladnutí",
            "Předání"
          ],
          longSteps: [
            "Příprava kvásku",
            "Autolýza",
            "Fermentolýza",
            "Sůl + voda + míchání",
            "Překlady celkem",
            "Kynutí na stole",
            "Kynutí v lednici",
            "Předehřátí pece",
            "Pečení",
            "Chladnutí",
            "Předání chleba"
          ],
          handover: "Předání",
          morning: "ráno",
          noon: "poledne",
          evening: "večer",
          night: "noc",
          hours: "h",
          minutes: "min",
          nodeHint: "Kliknutím z toho uděláš pevný bod"
        },
        en: {
          brandJoke: "a fit plan for bread",
          subtitle: "A picture-first sourdough plan for a busy day",
          total: "routine",
          delivery: "handover",
          recipe: "Recipe 1",
          recipeSub: "The dough scales itself to the loaf size.",
          hydration: "hydration",
          weight: "Loaf size",
          flour: "flour",
          water: "water",
          gridTitle: "Plan from handover",
          gridHint: "Drag the round loaf. The table also shows every previous point connected as one route.",
          today: "Earliest",
          detail: "detail",
          layouts: ["story", "big map", "recipe"],
          designs: ["honey", "night", "clean"],
          min: "earliest",
          max: "range",
          days: ["sun", "mon", "tue", "wed", "thu", "fri", "sat"],
          dayNames: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          ingredients: {
            wheat: "Wheat",
            rye: "Rye",
            pernerka: "Pernerka",
            water: "Water",
            salt: "Salt",
            cumin: "Caraway"
          },
          steps: [
            "Feed starter",
            "Autolyse",
            "Fermentolyse",
            "Salt + water",
            "Folds",
            "Rest",
            "Fridge",
            "Heat oven",
            "Bake",
            "Cool",
            "Handover"
          ],
          longSteps: [
            "Levain build",
            "Autolyse",
            "Fermentolyse",
            "Salt + water + mixing",
            "Folds total",
            "Bench proof",
            "Cold proof",
            "Oven preheat",
            "Bake",
            "Cooling",
            "Bread handover"
          ],
          handover: "Handover",
          morning: "morning",
          noon: "noon",
          evening: "evening",
          night: "night",
          hours: "h",
          minutes: "min",
          nodeHint: "Click to make this the fixed point"
        }
      };

      const ingredientBase = [
        ["wheat", 280, "#d39232"],
        ["rye", 122, "#9a5b28"],
        ["pernerka", 148, "#caa05d"],
        ["water", 427, "#408cb8"],
        ["salt", 21, "#8a8f91"],
        ["cumin", 2, "#607d3d"]
      ];

      const stepMeta = [
        { key: "levain", mins: 540, icon: "jar", color: "#8c5a26" },
        { key: "autolyse", mins: 60, icon: "bowl", color: "#d2a34d" },
        { key: "fermentolyse", mins: 20, icon: "bubble", color: "#c78b35" },
        { key: "mix", mins: 40, icon: "drop", color: "#4f9ac1" },
        { key: "folds", mins: 135, icon: "hands", color: "#9b6a2d" },
        { key: "bench", mins: 50, icon: "cloth", color: "#6f8d62" },
        { key: "cold", mins: 840, icon: "moon", color: "#50639d" },
        { key: "preheat", mins: 40, icon: "sun", color: "#d9952f" },
        { key: "bake", mins: 61, icon: "oven", color: "#a84c20" },
        { key: "cool", mins: 120, icon: "wind", color: "#6f9c9a" },
        { key: "handover", mins: 0, icon: "bread", color: "#8a4319" }
      ];

      const offsets = stepMeta.reduce((acc, step, index) => {
        acc[index] = index === 0 ? 0 : acc[index - 1] + stepMeta[index - 1].mins;
        return acc;
      }, []);
      const totalMinutes = offsets[offsets.length - 1];

      const $ = (id) => document.getElementById(id);
      const canvas = $("handoverCanvas");
      const ctx = canvas.getContext("2d");
      let canvasBox = null;
      let dragging = false;
      let schedule = [];
      let animationStart = performance.now();
      const state = loadState();

      function minHandoverTime() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate() + 3, START_HOUR, 0, 0, 0);
      }

      function alignToGrid(date) {
        const d = new Date(date);
        d.setMinutes(Math.round(d.getMinutes() / 15) * 15, 0, 0);
        if (d.getHours() < START_HOUR) d.setHours(START_HOUR, 0, 0, 0);
        if (d.getHours() >= END_HOUR) {
          d.setDate(d.getDate() + 1);
          d.setHours(START_HOUR, 0, 0, 0);
        }
        return d;
      }

      function loadState() {
        const fallback = {
          lang: "cs",
          weight: 1000,
          anchorIndex: 10,
          anchorTime: alignToGrid(minHandoverTime()).getTime(),
          layout: "story",
          design: "poster",
          detail: 2
        };
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          return {
            ...fallback,
            ...saved,
            anchorTime: Math.max(Number(saved.anchorTime || fallback.anchorTime), minHandoverTime().getTime())
          };
        } catch {
          return fallback;
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: state.lang,
          weight: state.weight,
          anchorIndex: state.anchorIndex,
          anchorTime: state.anchorTime,
          layout: state.layout,
          design: state.design,
          detail: state.detail
        }));
      }

      function dict() {
        return i18n[state.lang];
      }

      function recalc() {
        const start = state.anchorTime - offsets[state.anchorIndex] * MS;
        schedule = stepMeta.map((step, index) => ({
          ...step,
          index,
          name: dict().steps[index],
          longName: dict().longSteps[index],
          start: new Date(start + offsets[index] * MS),
          end: new Date(start + (offsets[index] + step.mins) * MS)
        }));
      }

      function getHandoverTime() {
        return state.anchorTime + (offsets[10] - offsets[state.anchorIndex]) * MS;
      }

      function clampHandoverDate(date) {
        const min = minHandoverTime().getTime();
        const max = min + 6 * DAY + TOTAL_GRID_MIN * MS;
        return new Date(Math.min(Math.max(date.getTime(), min), max));
      }

      function setAnchor(index, time) {
        state.anchorIndex = index;
        state.anchorTime = time;
        saveState();
        recalc();
        render();
      }

      function setHandover(time) {
        const clamped = clampHandoverDate(alignToGrid(new Date(time)));
        state.anchorIndex = 10;
        state.anchorTime = clamped.getTime();
        saveState();
        recalc();
        render();
      }

      function fmtTime(date) {
        return new Intl.DateTimeFormat(state.lang === "cs" ? "cs-CZ" : "en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }).format(date);
      }

      function fmtDate(date) {
        const d = new Date(date);
        const dateText = new Intl.DateTimeFormat(state.lang === "cs" ? "cs-CZ" : "en-US", {
          day: "2-digit",
          month: "2-digit"
        }).format(d);
        return `${dict().days[d.getDay()]} ${dateText}`;
      }

      function duration(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (!h) return `${m} ${dict().minutes}`;
        if (!m) return `${h} ${dict().hours}`;
        return `${h} ${dict().hours} ${m} ${dict().minutes}`;
      }

      function setText(id, value) {
        $(id).textContent = value;
      }

      function langClass(active) {
        return `px-3 py-2 rounded-full text-sm font-semibold ${active ? "bg-[var(--crust)] text-white" : "text-[var(--muted)] hover:bg-white/70"}`;
      }

      function renderLabels() {
        const t = dict();
        document.documentElement.lang = state.lang;
        setText("brandJoke", t.brandJoke);
        setText("subtitle", t.subtitle);
        setText("totalLabel", t.total);
        setText("deliveryLabel", t.delivery);
        setText("recipeTitle", t.recipe);
        setText("recipeSub", t.recipeSub);
        setText("hydrationLabel", t.hydration);
        setText("weightLabel", t.weight);
        setText("flourLabel", t.flour);
        setText("waterLabel", t.water);
        setText("gridTitle", t.gridTitle);
        setText("gridHint", t.gridHint);
        setText("todayBtn", t.today);
        setText("detailLabel", t.detail);
        ["Story", "Focus", "Recipe"].forEach((name, index) => setText(`layout${name}`, t.layouts[index]));
        ["Poster", "Night", "Clean"].forEach((name, index) => setText(`design${name}`, t.designs[index]));
        $("langCs").className = langClass(state.lang === "cs");
        $("langEn").className = langClass(state.lang === "en");
        document.body.dataset.layout = state.layout;
        document.body.dataset.design = state.design;
        $("detailRange").value = state.detail;
        updateControlButtons();
      }

      function updateControlButtons() {
        const layoutMap = { story: "layoutStory", focus: "layoutFocus", recipe: "layoutRecipe" };
        const designMap = { poster: "designPoster", night: "designNight", clean: "designClean" };
        Object.entries(layoutMap).forEach(([key, id]) => $(id).setAttribute("aria-pressed", String(state.layout === key)));
        Object.entries(designMap).forEach(([key, id]) => $(id).setAttribute("aria-pressed", String(state.design === key)));
      }

      function renderStats() {
        const handover = schedule[10].start;
        setText("deliveryValue", `${fmtDate(handover)} · ${fmtTime(handover)}`);
        setText("totalTime", duration(totalMinutes));
        setText("minDateLabel", `${dict().min}: ${fmtDate(minHandoverTime())}`);
        setText("maxDateLabel", `${dict().max}: ${fmtDate(new Date(minHandoverTime().getTime() + 6 * DAY))}`);
      }

      function renderRecipe() {
        const scale = state.weight / 1000;
        $("weightRange").value = state.weight;
        setText("weightOut", `${state.weight} g`);
        const flour = Math.round((280 + 122 + 148) * scale);
        const water = Math.round(427 * scale);
        setText("flourOut", `${flour} g`);
        setText("waterOut", `${water} g`);
        const max = Math.max(...ingredientBase.map((item) => item[1]));
        $("ingredients").innerHTML = ingredientBase.map(([key, grams, color]) => {
          const amount = Math.round(grams * scale);
          const pct = Math.max(3, grams / max * 100);
          return `
            <div class="rounded-lg border border-amber-900/10 bg-[#fff9ea]/72 px-2.5 py-2">
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="h-2.5 w-2.5 rounded-full shrink-0" style="background:${color}"></span>
                  <span class="text-sm font-semibold truncate">${dict().ingredients[key]}</span>
                </div>
                <strong class="text-sm tabular-nums">${amount} g</strong>
              </div>
              <div class="mt-1.5 h-1.5 rounded-full bg-amber-950/10 overflow-hidden">
                <div class="h-full rounded-full" style="width:${pct}%; background:${color}"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderStoryline() {
        const max = Math.max(...stepMeta.map((step) => step.mins));
        $("storyline").innerHTML = schedule.map((step) => {
          const pressed = step.index === state.anchorIndex ? "true" : "false";
          const grow = step.mins ? 0.62 + (step.mins / max) * 1.25 : .8;
          return `
            <button type="button" data-step="${step.index}" aria-pressed="${pressed}" title="${dict().nodeHint}" class="story-node min-w-0 flex-1 rounded-lg border border-white/40 bg-[#fff8e6]/80 px-2 py-2 text-center">
              <span class="mx-auto mb-1 block h-7 w-7 rounded-full bg-white/75 shadow-inner" data-icon="${step.icon}" style="border:2px solid ${step.color}"></span>
              <span class="block truncate text-[11px] font-semibold leading-tight">${step.name}</span>
              <span class="block text-[10px] text-[var(--muted)] tabular-nums">${fmtTime(step.start)}</span>
              <span class="mx-auto mt-1 block h-1.5 rounded-full bg-[var(--crust)]/75" style="width:${Math.min(100, grow * 42)}%"></span>
            </button>
          `;
        }).join("");
        $("storyline").querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            const index = Number(button.dataset.step);
            setAnchor(index, schedule[index].start.getTime());
          });
        });
      }

      function renderTimeline() {
        $("timeline").innerHTML = schedule.map((step) => {
          const pressed = step.index === state.anchorIndex ? "true" : "false";
          return `
            <button type="button" data-step="${step.index}" aria-pressed="${pressed}" title="${dict().nodeHint}" class="story-node min-w-0 rounded-lg border border-amber-900/12 bg-[#fff8e6]/72 px-1.5 py-2 text-left">
              <div class="flex items-center gap-1.5">
                <span class="h-2.5 w-2.5 rounded-full shrink-0" style="background:${step.color}"></span>
                <span class="truncate text-[11px] font-semibold">${step.longName}</span>
              </div>
              <div class="mt-1 text-[11px] text-[var(--muted)] tabular-nums">${fmtTime(step.start)} · ${fmtDate(step.start)}</div>
            </button>
          `;
        }).join("");
        $("timeline").querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            const index = Number(button.dataset.step);
            setAnchor(index, schedule[index].start.getTime());
          });
        });
      }

      function renderStars() {
        $("stars").innerHTML = Array.from({ length: 42 }, (_, i) => {
          const left = 30 + Math.random() * 42;
          const top = 10 + Math.random() * 38;
          const opacity = .35 + Math.random() * .55;
          return `<span class="absolute h-1 w-1 rounded-full bg-white" style="left:${left}%; top:${top}%; opacity:${opacity}"></span>`;
        }).join("");
      }

      function render() {
        renderLabels();
        renderStats();
        renderRecipe();
        renderStoryline();
        renderTimeline();
        drawCanvas();
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasBox = {
          w: rect.width,
          h: rect.height,
          left: 62,
          right: rect.width - 18,
          top: 54,
          bottom: rect.height - 42
        };
        drawCanvas();
      }

      function gridStartDate() {
        const min = minHandoverTime();
        return new Date(min.getFullYear(), min.getMonth(), min.getDate() - 2, 0, 0, 0, 0);
      }

      function canvasPointForDate(date) {
        const start = gridStartDate().getTime();
        const dayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
        const dayIndex = Math.round((dayStart - start) / DAY);
        const minute = (date.getHours() - START_HOUR) * 60 + date.getMinutes();
        const colW = (canvasBox.right - canvasBox.left) / 7;
        return {
          x: canvasBox.left + dayIndex * colW + colW / 2,
          y: canvasBox.top + (minute / TOTAL_GRID_MIN) * (canvasBox.bottom - canvasBox.top)
        };
      }

      function dateForCanvasPoint(x, y) {
        const colW = (canvasBox.right - canvasBox.left) / 7;
        const dayIndex = Math.min(6, Math.max(0, Math.floor((x - canvasBox.left) / colW)));
        const yClamped = Math.min(canvasBox.bottom, Math.max(canvasBox.top, y));
        const rawMin = ((yClamped - canvasBox.top) / (canvasBox.bottom - canvasBox.top)) * TOTAL_GRID_MIN;
        const snapped = Math.round(rawMin / 15) * 15;
        const d = new Date(gridStartDate().getTime() + dayIndex * DAY);
        d.setHours(START_HOUR, snapped, 0, 0);
        return clampHandoverDate(d);
      }

      function drawCanvas() {
        if (!canvasBox) return;
        const w = canvasBox.w;
        const h = canvasBox.h;
        ctx.clearRect(0, 0, w, h);
        drawSky(w, h);
        drawGrid();
        drawCalendarRoute();
        drawTarget();
      }

      function drawSky(w, h) {
        const g = ctx.createLinearGradient(0, 0, w, 0);
        g.addColorStop(0, "#fff2bd");
        g.addColorStop(.32, "#fff8dd");
        g.addColorStop(.55, "#dce6f8");
        g.addColorStop(.7, "#314276");
        g.addColorStop(1, "#fff0b1");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "rgba(255,255,255,.36)";
        for (let i = 0; i < 5; i++) {
          const x = 120 + i * 190;
          ctx.beginPath();
          ctx.ellipse(x, 32 + (i % 2) * 12, 50, 13, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        drawSun(112, 38, 24);
        drawMoon(w * .68, 34, 18);
      }

      function drawSun(x, y, r) {
        const g = ctx.createRadialGradient(x, y, 4, x, y, r * 2.2);
        g.addColorStop(0, "#fff6a4");
        g.addColorStop(.42, "#f6b72b");
        g.addColorStop(1, "rgba(246,183,43,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawMoon(x, y, r) {
        ctx.fillStyle = "rgba(255,255,255,.86)";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(49,66,118,.84)";
        ctx.beginPath();
        ctx.arc(x + 8, y - 4, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawGrid() {
        const colW = (canvasBox.right - canvasBox.left) / 7;
        const rowH = (canvasBox.bottom - canvasBox.top) / 8;
        const gridStart = gridStartDate();

        ctx.fillStyle = "rgba(255,248,226,.76)";
        roundRect(ctx, canvasBox.left, canvasBox.top - 28, canvasBox.right - canvasBox.left, canvasBox.bottom - canvasBox.top + 28, 12);
        ctx.fill();

        for (let i = 0; i < 7; i++) {
          const x = canvasBox.left + i * colW;
          ctx.fillStyle = i % 2 ? "rgba(255,255,255,.24)" : "rgba(153,91,29,.045)";
          ctx.fillRect(x, canvasBox.top, colW, canvasBox.bottom - canvasBox.top);
          const d = new Date(gridStart.getTime() + i * DAY);
          ctx.fillStyle = i === 0 ? "rgba(153,91,29,.16)" : "rgba(255,255,255,.42)";
          roundRect(ctx, x + 6, canvasBox.top - 24, colW - 12, 20, 10);
          ctx.fill();
          ctx.fillStyle = i === 0 ? "#673612" : "#6f5b44";
          ctx.font = "600 12px ui-rounded, system-ui";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`${dict().days[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`, x + colW / 2, canvasBox.top - 14);
        }

        ctx.strokeStyle = "rgba(128,89,36,.18)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 7; i++) {
          const x = canvasBox.left + i * colW;
          ctx.beginPath();
          ctx.moveTo(x, canvasBox.top - 28);
          ctx.lineTo(x, canvasBox.bottom);
          ctx.stroke();
        }
        for (let i = 0; i <= 8; i++) {
          const y = canvasBox.top + i * rowH;
          ctx.beginPath();
          ctx.moveTo(canvasBox.left, y);
          ctx.lineTo(canvasBox.right, y);
          ctx.stroke();
        }

        ctx.fillStyle = "#806447";
        ctx.font = "600 12px ui-rounded, system-ui";
        ctx.textAlign = "right";
        for (let hour = START_HOUR; hour <= END_HOUR; hour += 3) {
          const y = canvasBox.top + ((hour - START_HOUR) * 60 / TOTAL_GRID_MIN) * (canvasBox.bottom - canvasBox.top);
          ctx.fillText(`${String(hour).padStart(2, "0")}:00`, canvasBox.left - 10, y);
        }

        const labels = [
          [dict().morning, .12],
          [dict().noon, .38],
          [dict().evening, .72],
          [dict().night, .94]
        ];
        ctx.textAlign = "left";
        ctx.font = "600 11px ui-rounded, system-ui";
        labels.forEach(([label, ratio]) => {
          const y = canvasBox.top + ratio * (canvasBox.bottom - canvasBox.top);
          const labelW = ctx.measureText(label).width + 14;
          ctx.fillStyle = "rgba(255,248,226,.78)";
          roundRect(ctx, canvasBox.left + 8, y - 10, labelW, 20, 10);
          ctx.fill();
          ctx.fillStyle = "rgba(103,54,18,.68)";
          ctx.fillText(label, canvasBox.left + 15, y);
        });
      }

      function drawSchedulePath() {
        const start = schedule[0].start.getTime();
        const end = schedule[10].start.getTime();
        const points = schedule.map((step) => {
          const ratio = (step.start.getTime() - start) / (end - start || 1);
          const x = canvasBox.left + 20 + ratio * (canvasBox.right - canvasBox.left - 40);
          const y = canvasBox.bottom + 21 + Math.sin(ratio * Math.PI * 2) * 4;
          return { x, y, step };
        });
        ctx.strokeStyle = "rgba(103,54,18,.24)";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        points.forEach((p) => {
          ctx.fillStyle = p.step.index === state.anchorIndex ? "#8a4319" : p.step.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.step.index === state.anchorIndex ? 6 : 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function visibleCanvasPointForDate(date) {
        const p = canvasPointForDate(date);
        const hour = date.getHours() + date.getMinutes() / 60;
        if (hour < START_HOUR) p.y = canvasBox.top - 16;
        if (hour >= END_HOUR) p.y = canvasBox.bottom + 20;
        return {
          x: Math.min(canvasBox.right - 8, Math.max(canvasBox.left + 8, p.x)),
          y: Math.min(canvasBox.h - 18, Math.max(28, p.y))
        };
      }

      function drawCalendarRoute() {
        const detail = Number(state.detail || 2);
        const points = schedule.map((step) => ({
          ...visibleCanvasPointForDate(step.start),
          step
        }));
        ctx.save();
        ctx.strokeStyle = state.design === "night" ? "rgba(255,238,190,.52)" : "rgba(103,54,18,.32)";
        ctx.lineWidth = detail === 1 ? 3 : detail === 2 ? 4 : 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        points.forEach((p, index) => index ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();

        const labelRects = [];
        points.forEach((p, index) => {
          const active = p.step.index === state.anchorIndex;
          const isHandover = p.step.index === 10;
          const r = isHandover ? 16 : active ? 12 : detail === 1 ? 6 : 8;
          ctx.fillStyle = "rgba(255,248,226,.92)";
          ctx.strokeStyle = p.step.color;
          ctx.lineWidth = isHandover ? 4 : 3;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          drawMiniIcon(p.step.icon, p.x, p.y, r, p.step.color);
          if (!isHandover && (detail > 1 || index % 2 === 0)) {
            drawStepLabel(p, index, labelRects);
          }
        });
        ctx.restore();
      }

      function drawMiniIcon(icon, x, y, r, color) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1.6;
        if (icon === "drop") {
          ctx.beginPath();
          ctx.moveTo(x, y - r * .45);
          ctx.quadraticCurveTo(x + r * .45, y, x, y + r * .46);
          ctx.quadraticCurveTo(x - r * .45, y, x, y - r * .45);
          ctx.stroke();
        } else if (icon === "moon") {
          ctx.beginPath();
          ctx.arc(x, y, r * .42, Math.PI * .35, Math.PI * 1.65);
          ctx.stroke();
        } else if (icon === "sun") {
          ctx.beginPath();
          ctx.arc(x, y, r * .34, 0, Math.PI * 2);
          ctx.stroke();
        } else if (icon === "bread") {
          ctx.beginPath();
          ctx.ellipse(x, y + 1, r * .55, r * .38, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(x, y, r * .28, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStepLabel(point, index, labelRects) {
        const step = point.step;
        const detail = Number(state.detail || 2);
        const label = detail === 3
          ? `${step.name} · ${fmtTime(step.start)}`
          : step.name;
        ctx.font = detail === 3 ? "700 12px ui-rounded, system-ui" : "700 11px ui-rounded, system-ui";
        const w = Math.min(ctx.measureText(label).width + 18, 150);
        const candidates = [
          [point.x - w / 2, point.y - 34],
          [point.x - w / 2, point.y + 18],
          [point.x + 16, point.y - 12],
          [point.x - w - 16, point.y - 12],
          [point.x - w / 2, point.y - 58],
          [point.x - w / 2, point.y + 42]
        ];
        let chosen = candidates.map(([x, y]) => ({
          x: Math.min(Math.max(x, canvasBox.left + 4), canvasBox.right - w - 4),
          y: Math.min(Math.max(y, canvasBox.top + 4), canvasBox.bottom - 26)
        })).find((rect) => !labelRects.some((other) => intersects(rect.x, rect.y, w, 24, other.x, other.y, other.w, other.h)));
        if (!chosen) {
          chosen = {
            x: Math.min(Math.max(point.x - w / 2, canvasBox.left + 4), canvasBox.right - w - 4),
            y: Math.min(Math.max(point.y + 18 + (index % 4) * 25, canvasBox.top + 4), canvasBox.bottom - 26)
          };
        }
        labelRects.push({ x: chosen.x - 4, y: chosen.y - 4, w: w + 8, h: 32 });
        ctx.fillStyle = state.design === "night" ? "rgba(35,38,73,.9)" : "rgba(255,246,218,.94)";
        roundRect(ctx, chosen.x, chosen.y, w, 24, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(153,91,29,.22)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = state.design === "night" ? "#fff2c8" : "#3b281b";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        clipText(label, chosen.x + w / 2, chosen.y + 12, w - 14);
      }

      function intersects(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function clipText(text, x, y, maxWidth) {
        if (ctx.measureText(text).width <= maxWidth) {
          ctx.fillText(text, x, y);
          return;
        }
        let out = text;
        while (out.length > 3 && ctx.measureText(`${out}…`).width > maxWidth) out = out.slice(0, -1);
        ctx.fillText(`${out}…`, x, y);
      }

      function drawTarget() {
        const date = schedule[10].start;
        const p = canvasPointForDate(date);
        const pulse = Math.sin((performance.now() - animationStart) / 420) * 2.5;

        ctx.save();
        ctx.shadowColor = "rgba(103,54,18,.32)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "rgba(153,91,29,.14)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 31 + pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#9b5420";
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 22, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff1c8";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(p.x - 4, p.y - 3, 11, Math.PI * 1.1, Math.PI * 1.92);
        ctx.stroke();
        ctx.strokeStyle = "#5e876d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.stroke();

        const label = `${dict().handover}: ${fmtDate(date)} · ${fmtTime(date)}`;
        ctx.font = "700 14px ui-rounded, system-ui";
        const labelW = ctx.measureText(label).width + 24;
        const labelX = Math.min(Math.max(p.x - labelW / 2, canvasBox.left + 4), canvasBox.right - labelW - 4);
        const labelY = p.y > canvasBox.top + 48 ? p.y - 48 : p.y + 30;
        ctx.fillStyle = "#fff5d9";
        roundRect(ctx, labelX, labelY, labelW, 30, 12);
        ctx.fill();
        ctx.strokeStyle = "rgba(153,91,29,.24)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#3b281b";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, labelX + labelW / 2, labelY + 15);
        ctx.restore();
      }

      function roundRect(c, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + radius, y);
        c.arcTo(x + w, y, x + w, y + h, radius);
        c.arcTo(x + w, y + h, x, y + h, radius);
        c.arcTo(x, y + h, x, y, radius);
        c.arcTo(x, y, x + w, y, radius);
        c.closePath();
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        const point = event.touches ? event.touches[0] : event;
        return { x: point.clientX - rect.left, y: point.clientY - rect.top };
      }

      function startDrag(event) {
        event.preventDefault();
        dragging = true;
        moveDrag(event);
      }

      function moveDrag(event) {
        if (!dragging) return;
        event.preventDefault();
        const p = pointerPosition(event);
        setHandover(dateForCanvasPoint(p.x, p.y).getTime());
      }

      function endDrag() {
        dragging = false;
      }

      function animate() {
        drawCanvas();
        requestAnimationFrame(animate);
      }

      $("weightRange").addEventListener("input", (event) => {
        state.weight = Number(event.target.value);
        saveState();
        renderRecipe();
      });

      $("langCs").addEventListener("click", () => {
        state.lang = "cs";
        recalc();
        saveState();
        render();
      });

      $("langEn").addEventListener("click", () => {
        state.lang = "en";
        recalc();
        saveState();
        render();
      });

      $("todayBtn").addEventListener("click", () => setHandover(minHandoverTime().getTime()));
      $("plusDayBtn").addEventListener("click", () => setHandover(getHandoverTime() + DAY));
      $("layoutStory").addEventListener("click", () => setViewOption("layout", "story"));
      $("layoutFocus").addEventListener("click", () => setViewOption("layout", "focus"));
      $("layoutRecipe").addEventListener("click", () => setViewOption("layout", "recipe"));
      $("designPoster").addEventListener("click", () => setViewOption("design", "poster"));
      $("designNight").addEventListener("click", () => setViewOption("design", "night"));
      $("designClean").addEventListener("click", () => setViewOption("design", "clean"));
      $("detailRange").addEventListener("input", (event) => {
        state.detail = Number(event.target.value);
        saveState();
        drawCanvas();
      });

      function setViewOption(key, value) {
        state[key] = value;
        saveState();
        render();
        requestAnimationFrame(resizeCanvas);
      }

      canvas.addEventListener("mousedown", startDrag);
      canvas.addEventListener("mousemove", moveDrag);
      window.addEventListener("mousemove", moveDrag);
      window.addEventListener("mouseup", endDrag);
      canvas.addEventListener("touchstart", startDrag, { passive: false });
      canvas.addEventListener("touchmove", moveDrag, { passive: false });
      window.addEventListener("touchmove", moveDrag, { passive: false });
      window.addEventListener("touchend", endDrag);
      window.addEventListener("resize", resizeCanvas);

      renderStars();
      recalc();
      render();
      resizeCanvas();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
